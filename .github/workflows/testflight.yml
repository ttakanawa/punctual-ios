name: TestFlight

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Repository branch to build
        type: string
        required: true
        default: main
      source_sha:
        description: Full commit SHA from the passing CI run for that branch
        type: string
        required: true

permissions:
  actions: read
  contents: read

concurrency: xcode-cloud

jobs:
  start:
    if: >-
      github.repository == 'ttakanawa/punctual-ios' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'ttakanawa' &&
      github.triggering_actor == 'ttakanawa'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: appstore-connect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: mise.toml
          package-manager-cache: false
      - name: Authorize deployment tag creation and secret preflight
        id: deployment-app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.TESTFLIGHT_APP_CLIENT_ID }}
          private-key: ${{ secrets.TESTFLIGHT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-environments: read
          permission-secrets: read
      - name: Start Xcode Cloud
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          GITHUB_ACTIONS_READ_TOKEN: ${{ github.token }}
          TESTFLIGHT_APP_TOKEN: ${{ steps.deployment-app.outputs.token }}
          TESTFLIGHT_TAG_CREATION_RULESET_ID: ${{ vars.TESTFLIGHT_TAG_CREATION_RULESET_ID }}
          TESTFLIGHT_TAG_IMMUTABILITY_RULESET_ID: ${{ vars.TESTFLIGHT_TAG_IMMUTABILITY_RULESET_ID }}
          XCODE_CLOUD_WORKFLOW_ID: ${{ vars.XCODE_CLOUD_WORKFLOW_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_ENV_PRIVATE_KEY }}
        run: node Scripts/xcode-cloud.mjs start "$SOURCE_BRANCH" "$SOURCE_SHA"
